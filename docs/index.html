<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邮箱验证 · 铁记</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">
<style>
  :root{
    --navy:#202636; --navy-deep:#181D2A; --card:#FFFFFF; --bg:#F1F0EC;
    --text:#1B1A16; --muted:#7C7970; --border:#E4E2DB;
    --warm:#F2604B; --warm-2:#FA8F66; --ok:#0E9F6E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --card:#1C1D23; --bg:#131318; --text:#EFEEE9; --muted:#94918A; --border:#2C2D34;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; background:var(--card);
    border:1px solid var(--border); border-radius:22px;
    padding:44px 32px 36px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.10);
  }
  .mark{width:80px; height:80px; border-radius:19px; margin:0 auto 26px; display:block;}
  h1{font-size:24px; font-weight:700; margin:0 0 10px; letter-spacing:-.4px;}
  p{font-size:15px; line-height:1.65; color:var(--muted); margin:0 0 8px;}
  .steps{
    margin:26px 0 0; padding:16px 18px; text-align:left;
    background:var(--bg); border:1px solid var(--border); border-radius:14px;
    font-size:14px; line-height:1.7; color:var(--text);
  }
  .btn{
    display:block; margin-top:22px; padding:15px 20px;
    background:var(--navy); color:#fff; text-decoration:none;
    border-radius:14px; font-size:15px; font-weight:700;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn:focus-visible{outline:3px solid var(--warm); outline-offset:2px;}
  .foot{margin-top:22px; font-size:12.5px; color:var(--muted);}
  .foot a{color:var(--muted);}
  .bad h1{color:var(--warm);}
  [hidden]{display:none!important;}
</style>
</head>
<body>
  <div class="card" id="card">
    <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="warm" x1="0.08" y1="0.15" x2="0.95" y2="0.8">
          <stop offset="0" stop-color="#F2604B"/><stop offset="0.5" stop-color="#FA8F66"/>
          <stop offset="1" stop-color="#FDBE9C"/>
        </linearGradient>
      </defs>
      <rect width="1024" height="1024" rx="229" fill="#202636"/>
      <circle cx="512" cy="512" r="296" fill="none" stroke="#2E3A56" stroke-width="92"/>
      <path d="M 243.7 386.9 A 296 296 0 1 0 790.1 410.8" fill="none"
            stroke="url(#warm)" stroke-width="92" stroke-linecap="round"/>
      <g transform="translate(512,512) scale(1.1) translate(-512,-512)" fill="#FFFFFF">
        <rect x="444" y="493" width="136" height="38" rx="19"/>
        <rect x="400" y="419" width="52" height="186" rx="26"/>
        <rect x="572" y="419" width="52" height="186" rx="26"/>
        <rect x="335" y="453" width="42" height="118" rx="21"/>
        <rect x="647" y="453" width="42" height="118" rx="21"/>
      </g>
    </svg>

    <div id="ok">
      <h1>邮箱验证成功</h1>
      <p>你的铁记账号已经激活。</p>
      <div class="steps">
        回到「铁记」App，用刚才注册的<b>邮箱和密码</b>登录，就可以开始记录训练了。
      </div>
      <a class="btn" href="gymtracker://">打开铁记</a>
      <p class="foot">按钮在手机上可直接唤起 App；在电脑上请手动打开手机里的铁记。</p>
    </div>

    <div id="bad" hidden>
      <h1>验证链接已失效</h1>
      <p id="badmsg">这个链接可能已经过期，或者已经被使用过了。</p>
      <div class="steps">
        打开「铁记」App，在注册页面点<b>「重新发送验证邮件」</b>，然后点击新邮件里的链接。
      </div>
      <a class="btn" href="gymtracker://">打开铁记</a>
    </div>

    <p class="foot"><a href="./privacy.html">隐私政策</a></p>
  </div>

<script>
  // Supabase 验证失败时会把错误放在 URL 的 hash 或 query 里
  var params = new URLSearchParams(
    (location.hash || '').replace(/^#/, '') + '&' + (location.search || '').replace(/^\?/, '')
  );
  var err = params.get('error') || params.get('error_code');
  if (err) {
    document.getElementById('ok').hidden = true;
    document.getElementById('bad').hidden = false;
    document.getElementById('card').classList.add('bad');
    // Supabase 返回的 error_description 是英文，不直接展示；
    // 已知错误码翻成中文，其余沿用页面上的默认说明。
    var zh = {
      otp_expired: '这个链接已经过期了。验证邮件有有效期，请重新获取一封。',
      access_denied: '这个链接已经失效，可能已经被使用过了。',
    };
    var msg = zh[params.get('error_code')] || zh[params.get('error')];
    if (msg) document.getElementById('badmsg').textContent = msg;
  }
</script>
</body>
</html>
